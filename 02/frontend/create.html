<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글 작성</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>글 작성</h1>
        <p>작성자 이름, 제목, 내용을 입력해주세요.</p>
      </div>

      <a class="button secondary" href="index.html">목록으로</a>
    </header>

    <main>
      <section class="card">
        <form id="post-form" class="form">
          <div class="form-group">
            <label for="author-name">작성자 이름</label>
            <input id="author-name" type="text" maxlength="50" placeholder="예: 홍길동">
          </div>

          <div class="form-group">
            <label for="title">제목</label>
            <input id="title" type="text" maxlength="200" placeholder="제목을 입력하세요">
          </div>

          <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" rows="10" placeholder="내용을 입력하세요"></textarea>
          </div>

          <div id="error-message" class="message error hidden"></div>

          <div class="form-actions">
            <button class="button primary" type="submit">등록하기</button>
            <a class="button secondary" href="index.html">취소</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
