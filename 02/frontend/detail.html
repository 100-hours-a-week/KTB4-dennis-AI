<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>게시글 상세</h1>
        <p>게시글 내용과 댓글을 확인할 수 있습니다.</p>
      </div>

      <a class="button secondary" href="index.html">목록으로</a>
    </header>

    <main>
      <section class="card">
        <div id="post-loading-message" class="message">게시글을 불러오는 중입니다.</div>
        <div id="post-error-message" class="message error hidden"></div>

        <article id="post-detail" class="post-detail hidden">
          <h2 id="post-title"></h2>
          <div class="meta">
            <span id="post-author"></span>
            <span id="post-date"></span>
          </div>
          <p id="post-content"></p>
        </article>
      </section>

      <section class="card">
        <div class="section-title">
          <h2>댓글</h2>
        </div>

        <div id="comment-error-message" class="message error hidden"></div>
        <div id="empty-comment-message" class="message hidden">아직 댓글이 없습니다.</div>

        <ul id="comment-list" class="comment-list"></ul>

        <form id="comment-form" class="form comment-form">
          <h3>댓글 작성</h3>

          <div class="form-group">
            <label for="comment-author-name">작성자 이름</label>
            <input id="comment-author-name" type="text" maxlength="50" placeholder="예: 홍길동">
          </div>

          <div class="form-group">
            <label for="comment-content">댓글 내용</label>
            <textarea id="comment-content" rows="4" placeholder="댓글을 입력하세요"></textarea>
          </div>

          <button class="button primary" type="submit">댓글 등록</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
